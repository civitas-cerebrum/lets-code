name: debug-linux-hang
# TEMPORARY: one step per test file on Ubuntu, to find the file that loses the
# runner (the job's step list shows which step was running). Remove after.
on:
  push:
    branches: [feat/windows]
permissions:
  contents: read
jobs:
  steps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: agent-guard.test.mjs
        timeout-minutes: 6
        run: sudo systemd-run --scope --quiet -p MemoryMax=8G -p MemorySwapMax=0 -- sudo -u "$(id -un)" env "PATH=${PATH}" "HOME=${HOME}" TEST_TIMEOUT=300 bash tests/run.sh agent-guard.test.mjs
      - name: backend.test.mjs
        timeout-minutes: 6
