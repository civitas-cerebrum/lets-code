name: debug-linux-hang
# TEMPORARY: the CI test step as it is, ended by timeout before the job is,
# so its log is kept and shows where it hangs. Remove after.
on:
  push:
    branches: [feat/windows]
permissions:
  contents: read
jobs:
  whole:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: whole suite, bounded
        run: |
          HEARTBEAT_S=30 bash .github/ci-heartbeat.sh &
          hb=$!
          timeout -k 10 1200 sudo systemd-run --scope --quiet -p MemoryMax=8G -p MemorySwapMax=0 -- sudo -u "$(id -un)" env "PATH=${PATH}" "HOME=${HOME}" TEST_TIMEOUT=240 tests/run.sh; rc=$?
          echo "run.sh rc=${rc}"
          kill "${hb}"
          echo "--- processes left:"; ps -eo pid,ppid,etime,args --sort=start_time | tail -25
          exit "${rc}"
