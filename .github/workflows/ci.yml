name: ✅ CI

# Runs the test suite on every pull request and on every push to main:
# the shell tests (probes, endpoint parsing, helper prefetch, git guard
# launch side) and the node tests for the pi extensions, on Linux, macOS
# (the script targets bash 3.2, which macOS ships) and Windows (in Git Bash,
# where lets-code runs there, with native node, python and git).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # the suite takes 2 (Linux) to 8 (macOS) minutes, longer on Windows, where
    # every process Git Bash starts is slow; a hang ends here, and
    # tests/run.sh stops a single file after TEST_TIMEOUT with its process tree
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 25 }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows
    steps:
      - name: 🗂️  Checkout
        uses: actions/checkout@v4

      - name: ⚙️  Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🐍  Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🔎  Syntax check (bash 3.2 on macOS)
        run: bash -n lets-code && bash --version | head -1

      # On Linux the suite runs in a memory-capped scope with a heartbeat: since
      # #98 the Ubuntu job died now and then with no log at all (the runner itself
      # gone, not a test that failed), so a runaway now dies in the scope, the
      # runner lives, and the log shows how memory went and which file it was.
      - name: 🧪  Tests
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            bash .github/ci-heartbeat.sh &
            sudo systemd-run --scope --quiet -p MemoryMax=8G -p MemorySwapMax=0 -- sudo -u "$(id -un)" env "PATH=${PATH}" "HOME=${HOME}" tests/run.sh
          else
            tests/run.sh
          fi
